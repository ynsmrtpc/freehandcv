name: Checks
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: freehandcv
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: freehandcv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U freehandcv -d freehandcv_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://freehandcv:test-only-password@localhost:5432/freehandcv_test
      E2E_PRODUCTION: "1"
      BETTER_AUTH_SECRET: isolated-ci-auth-secret-never-use-in-production-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
