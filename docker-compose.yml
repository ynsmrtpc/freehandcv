# Yerel geliştirme veritabanı. Canlıda Postgres Coolify üzerinde ayrı servis olarak çalışır.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freehandcv
      POSTGRES_PASSWORD: freehandcv
      POSTGRES_DB: freehandcv
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freehandcv"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
